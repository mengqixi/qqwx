<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>梦柒兮</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <!-- 自定义标题栏 -->
    <div class="titlebar" id="titlebar">
        <div class="titlebar-drag">
            <div class="titlebar-brand">
                <div class="app-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <rect x="3" y="3" width="7" height="7" rx="1.5" fill="#fff" opacity="0.9"/>
                        <rect x="14" y="3" width="7" height="7" rx="1.5" fill="#fff" opacity="0.5"/>
                        <rect x="3" y="14" width="7" height="7" rx="1.5" fill="#fff" opacity="0.5"/>
                        <rect x="14" y="14" width="7" height="7" rx="1.5" fill="#fff" opacity="0.9"/>
                    </svg>
                </div>
                <span class="titlebar-text">梦柒兮</span>
            </div>
            <div class="titlebar-actions">
                <button class="tb-btn" id="btnMinimize">
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                        <line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </button>
                <button class="tb-btn tb-close" id="btnClose">
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                        <line x1="3" y1="3" x2="9" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        <line x1="9" y1="3" x2="3" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <div class="app-body">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-top">
                <!-- 连接指示器 -->
                <div class="connector" id="connector">
                    <div class="connector-dot" id="statusDot"></div>
                    <div class="connector-info">
                        <span class="connector-label" id="statusText">连接中...</span>
                        <span class="connector-id" id="clientId">-</span>
                    </div>
                </div>

                <!-- 在线人数 -->
                <div class="peers">
                    <div class="peer-row">
                        <div class="peer-icon pc-icon">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="2" y="3" width="20" height="14" rx="2"/>
                                <line x1="8" y1="21" x2="16" y2="21"/>
                                <line x1="12" y1="17" x2="12" y2="21"/>
                            </svg>
                        </div>
                        <span class="peer-label">PC 端</span>
                        <span class="peer-count" id="pcCount">0</span>
                    </div>
                    <div class="peer-row">
                        <div class="peer-icon android-icon">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="5" y="2" width="14" height="20" rx="2"/>
                                <line x1="9" y1="6" x2="15" y2="6"/>
                                <line x1="9" y1="18" x2="15" y2="18"/>
                            </svg>
                        </div>
                        <span class="peer-label">手机端</span>
                        <span class="peer-count" id="androidCount">0</span>
                    </div>
                </div>
            </div>

            <!-- 底部设置 -->
            <div class="sidebar-bottom">
                <button class="sidebar-btn" id="btnSettings">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                </button>
            </div>
        </aside>

        <!-- 主内容 -->
        <main class="main-content">
            <!-- 头部 -->
            <header class="main-header">
                <h1 class="main-title">发送提醒</h1>
                <div class="header-actions">
                    <button class="btn btn-ghost" id="btnClearLog">清空记录</button>
                </div>
            </header>

            <!-- 提醒输入区 -->
            <div class="compose-card">
                <div class="compose-body">
                    <textarea id="reminderBody" class="compose-textarea"
                              placeholder="输入提醒内容..." maxlength="200" rows="2"></textarea>
                    <!-- 置顶区域 -->
                    <div class="pin-area">
                        <label class="pin-toggle">
                            <input type="checkbox" id="pinCheckbox" />
                            <span class="pin-toggle-slider"></span>
                            <span class="pin-toggle-label">📌 置顶</span>
                        </label>
                        <div class="pin-duration-group" id="pinDurationGroup">
                            <button class="pin-duration-btn active" data-hours="1">1h</button>
                            <button class="pin-duration-btn" data-hours="6">6h</button>
                            <button class="pin-duration-btn" data-hours="24">24h</button>
                        </div>
                    </div>
                </div>
                <div class="compose-footer">
                    <div class="footer-left">
                        <input type="file" id="photoInput" accept="image/*" hidden />
                        <button class="btn btn-photo" id="btnAttach" title="发送照片">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2"/>
                                <circle cx="8.5" cy="8.5" r="1.5"/>
                                <path d="M21 15l-5-5L5 21"/>
                            </svg>
                            <span>照片</span>
                        </button>
                        <span id="photoStatus" class="photo-status"></span>
                        <span class="compose-hint">按 Enter 发送</span>
                    </div>
                    <button class="btn btn-primary" id="btnRemind" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                        <span>发送提醒</span>
                    </button>
                </div>
            </div>

            <!-- 消息记录 -->
            <div class="log-section">
                <div class="log-header">
                    <span class="log-title">消息记录</span>
                    <span class="log-badge" id="logCount">0</span>
                </div>
                <div class="log-list" id="messageList">
                    <div class="log-empty">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                        <span>暂无消息</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 设置弹窗 -->
    <div class="modal-overlay hidden" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h2>设置</h2>
                <button class="modal-close" id="btnCloseModal">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">服务器地址</label>
                    <div class="form-row">
                        <input type="text" id="serverUrl" class="form-input"
                               placeholder="wss://your-server/ws?type=pc" />
                        <button class="btn btn-secondary" id="btnReconnect">重连</button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" id="btnSaveSettings">保存</button>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
